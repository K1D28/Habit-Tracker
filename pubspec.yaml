name: habit_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.18.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  image_picker: ^0.8.5+3  # Add Image Picker for avatar selection
  shared_preferences: ^2.0.15  # Add shared_preferences for saving profile data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.1.7  # Add build_runner for code generation
  hive_generator: ^1.1.1  # Add hive_generator for automatic code generation for Hive models

flutter:
  uses-material-design: true